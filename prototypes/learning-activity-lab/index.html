<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Standalone NEST learning activity prototypes for quizzes and interactive mini-games.">
  <title>NEST Activity Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" type="button" data-route="overview" aria-label="Open activity overview">
      <span class="brand-mark">N</span>
      <span><strong>NEST Activity Lab</strong><small>Standalone interaction prototype</small></span>
    </button>
    <div class="topbar-actions">
      <span class="overall-progress" id="overall-progress">0 of 6 completed</span>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">◐</button>
      <button class="button button-secondary" id="reset-all" type="button">Reset results</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="activity-nav" aria-label="Activity prototypes">
      <div class="nav-heading"><span>Prototype set</span><strong>Choose an activity</strong></div>
      <nav id="activity-nav"></nav>
      <p class="storage-note">Demo results stay only in this browser.</p>
    </aside>
    <main id="app" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
